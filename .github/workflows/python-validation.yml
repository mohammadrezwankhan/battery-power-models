name: Python validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
      - ".github/workflows/python-validation.yml"
  push:
    branches:
      - main
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
      - ".github/workflows/python-validation.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  test:
    name: Run model tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit runner network activity
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install declared development dependencies
        run: python -m pip install --group dev

      - name: Run tests
        run: python -m unittest discover -s tests -v

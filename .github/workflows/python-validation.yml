name: Python validation

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  test:
    name: Run model tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit runner network activity
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install declared development dependencies
        run: python -m pip install --group dev

      - name: Run tests
        run: python -m unittest discover -s tests -v

  minimum-python:
    name: Python 3.10 compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Audit runner network activity
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up supported minimum Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      - name: Ensure dependency groups are supported
        run: python -m pip install --upgrade pip
      - name: Install declared development dependencies
        run: python -m pip install --group dev
      - name: Run full model regression suite
        run: python -m unittest discover -s tests -v
      - name: Exercise both public CLI entry points
        run: |
          python src/battery_thermal.py --current 80 --duration 900 --output "$RUNNER_TEMP/thermal_trace.csv"
          python src/dc_link.py

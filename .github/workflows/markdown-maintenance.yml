name: Documentation and model validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**.md"
      - "**.py"
      - "**.m"
      - "CITATION.cff"
      - ".github/workflows/markdown-maintenance.yml"
  push:
    branches:
      - main
    paths:
      - "**.md"
      - "**.py"
      - "**.m"
      - "CITATION.cff"
      - ".github/workflows/markdown-maintenance.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Test Python models
        run: python -m unittest discover -s tests -v

      - name: Run thermal example
        run: python src/battery_thermal.py --current 80 --duration 900 --output "$RUNNER_TEMP/thermal_trace.csv"

      - name: Run DC-link example
        run: python src/dc_link.py

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --verbose --no-progress README.md CONTRIBUTING.md
          fail: true

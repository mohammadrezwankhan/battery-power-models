name: Documentation and model validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**.md"
      - "**.py"
      - "**.m"
      - "CITATION.cff"
      - ".github/workflows/markdown-maintenance.yml"
  push:
    branches:
      - main
    paths:
      - "**.md"
      - "**.py"
      - "**.m"
      - "CITATION.cff"
      - ".github/workflows/markdown-maintenance.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test Python models
        run: python -m unittest discover -s tests -v

      - name: Run thermal example
        run: python src/battery_thermal.py --current 80 --duration 900 --output "$RUNNER_TEMP/thermal_trace.csv"

      - name: Run DC-link example
        run: python src/dc_link.py

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress README.md CONTRIBUTING.md
          fail: true

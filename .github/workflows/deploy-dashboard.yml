# Bundle generation replaces workflow with legacy, workflow, or existing-workflow.
# legacy: GitHub publishes the default branch /docs. existing-workflow: another
# reviewed workflow publishes docs. Both modes retain the validation job below.
name: Flagship dashboard

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'assets/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Audit runner network activity
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Check out dashboard source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            docs
            assets
          sparse-checkout-cone-mode: true
      - name: Validate static dashboard and lesson configuration
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          docs = Path('docs')
          index = docs / 'index.html'
          assert index.is_file(), 'Missing docs/index.html'
          html = index.read_text(encoding='utf-8')
          assert 'data-flagship-repo="' + os.environ['EXPECTED_REPOSITORY'] + '"' in html, 'Dashboard repository marker mismatch'
          assert 'data-flagship-version="1.0"' in html, 'Dashboard version marker mismatch'
          config = json.loads((docs / 'lesson-config.json').read_text(encoding='utf-8'))
          assert isinstance(config, dict), 'Lesson configuration must be an object'
          for item in docs.rglob('*'):
              assert not item.is_symlink(), 'Pages artifacts cannot contain symbolic links: ' + str(item)
          assert '<script src="https://' not in html and "<script src='https://" not in html, 'Dashboard scripts must be self-contained'
          print('Static dashboard, identity, and lesson JSON validated.')
          PY

  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Audit runner network activity
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Check out dashboard source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: docs
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload static docs
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: docs
      - name: Wait for uniquely indexed Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            echo "Pages artifact lookup $attempt of 20."
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq ".artifacts | map(select(.name == \"$PAGES_ARTIFACT_NAME\" and .expired == false)) | length")
            if [[ "$count" == "1" ]]; then
              echo "Exactly one Pages artifact is indexed for this attempt."
              exit 0
            fi
            if [[ "$count" != "0" ]]; then
              echo "Expected exactly one Pages artifact; found $count." >&2
              exit 1
            fi
            sleep 3
          done
          echo "Pages artifact not indexed within the bounded 60-second check." >&2
          exit 1
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
